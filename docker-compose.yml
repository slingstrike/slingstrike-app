name: slingstrike
services:
  backend:
    image: slingstrike-backend-1:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    volumes:
      - olf-data:/data
    environment:
      - OLF_DB_PATH=/data/SlingStrike.db
      - OLF_LIBRARY_DIR=/library/community
      - OLF_SIEM_PROFILES_DIR=/library/siem-profiles
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s

  frontend:
    image: slingstrike-frontend-1:latest
    build: ./frontend
    restart: unless-stopped
    environment:
      - SLINGSTRIKE_HOST=${SLINGSTRIKE_HOST:-localhost}
      - SLINGSTRIKE_TLS_CERT_PEM=${SLINGSTRIKE_TLS_CERT_PEM:-}
      - SLINGSTRIKE_TLS_KEY_PEM=${SLINGSTRIKE_TLS_KEY_PEM:-}
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  olf-data:
  caddy-data:
  caddy-config:
