services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    volumes:
      - olf-data:/data
    environment:
      - OLF_DB_PATH=/data/SlingStrike.db
      - OLF_LIBRARY_DIR=/library/community
      - OLF_SIEM_PROFILES_DIR=/library/siem-profiles
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      app:
        condition: service_healthy

volumes:
  olf-data:
