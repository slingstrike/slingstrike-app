[project]
name = "openlogforge"
version = "0.1.0-dev"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"api/*.py" = ["B008"]
"tests/*.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "main.py",
    "tests/*",
    "alembic/*",
]

[tool.coverage.report]
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests"]
